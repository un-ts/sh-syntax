name: Wasm Debug

on:
  push:
    branches:
      - '**'

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
      - uses: acifani/setup-tinygo@dd8a7075d951a7595b2ef2123ed0ab1af0c13e56 # v3.0.0
        with:
          tinygo-version: '0.41.1'
          install-binaryen: true
      - run: |
          set -x
          go version
          tinygo version
          go run ./scripts/gen-encoder
          tinygo build -gc=leaking -o main.wasm -target ./target.json --no-debug
          git diff --stat
